name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore christmedical.com.sln

      - name: Format (verify .editorconfig)
        run: dotnet format christmedical.com.sln --verify-no-changes --no-restore

      - name: Build (.NET)
        run: dotnet build christmedical.com.sln -c Release --no-restore

      - name: Test (.NET)
        run: dotnet test christmedical.com.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & verify frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install chromium --with-deps
          npm run ci

  deploy-api:
    name: Deploy API (Railway)
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      # Railway service: repo root, Dockerfile api/Dockerfile (see docs/deploy-production.md).
      - name: Deploy
        working-directory: .
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --detach \
            --project 5084d868-f41c-428c-92a8-950e5464b450 \
            --service 1458908a-791e-470d-b83c-19996bdf6714 \
            --environment production

  deploy-frontend:
    name: Deploy frontend (Vercel)
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Deploy to Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prod --token "$VERCEL_TOKEN"
